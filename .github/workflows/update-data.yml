name: Update league data

on:
  schedule:
    # GitHub throttles scheduled runs hardest on the top of the hour and often
    # drops them (a single "0 * * * *" was only firing every 4-7 hours), so ask
    # four times an hour at off-peak minutes. The concurrency group below keeps
    # overlapping runs from stepping on each other, and a run that finds nothing
    # new commits nothing.
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch data and compute stats
        run: node scripts/build.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update league data"
            # main may have moved (code pushes) while this run was building
            git pull --rebase --autostash origin main
            git push
          fi

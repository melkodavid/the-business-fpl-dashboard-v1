<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live page themes</title>
<!-- Everything below resolves from the site root, so the real Live page code and data load as-is. -->
<base href="../">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Playfair+Display:ital,wght@0,700;1,700&family=Kalam:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { margin: 0; background: #07080d; }
  .picker { position: sticky; top: 0; z-index: 50; padding: 12px 16px 10px; background: rgba(7,8,13,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.1); font-family: "Archivo", sans-serif; color: #eef1f4; }
  .picker h1 { margin: 0 0 8px; font: 400 1.6rem/1 "Bebas Neue", sans-serif; letter-spacing: 0.05em; }
  .picker-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .picker button { flex-shrink: 0; cursor: pointer; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); color: #eef1f4; border-radius: 99px; padding: 8px 14px; font: 800 0.72rem "Archivo", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
  .picker button[aria-pressed="true"] { background: #00ff85; color: #05231a; border-color: #00ff85; }
  .picker p { margin: 8px 0 0; font-size: 0.85rem; color: #aab3c0; max-width: 85ch; line-height: 1.45; }
  .picker p b { color: #eef1f4; }
  .stage { max-width: 1140px; margin: 0 auto; padding: 22px 16px 60px; }
  .stage .lv-refresh { display: none; }
  /* Theme rules only set families and colours on numbers, never sizes, so the
     site's phone layout rules keep their say on small screens. */

  /* =====================================================================
     1 · HOUSE -- the site's own look, dressed for matchday: midnight
     panel with a purple and gold glow, gold italic section titles, glass
     cards with a purple-to-gold edge, lime for anything live.
     ===================================================================== */
  .lv.lv-house { position: relative; padding: 24px 22px 30px; border-radius: 16px;
    background: radial-gradient(ellipse 700px 320px at 0 0, rgba(155,92,224,0.2), transparent 60%), radial-gradient(ellipse 600px 320px at 100% 100%, rgba(201,166,96,0.14), transparent 60%), linear-gradient(180deg, #11131d, #0a0b12);
    border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 70px -30px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05); }
  .lv-house .lv-head::before { content: "Matchday"; display: block; width: 100%; font: 800 0.66rem "Archivo", sans-serif; letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold); }
  .lv-house .lv-title h2 em { text-shadow: 0 0 22px rgba(0,255,133,0.45); }
  .lv-house .lv-h3 { display: flex; align-items: center; gap: 12px; font: italic 600 1.45rem "Cormorant Garamond", serif; letter-spacing: 0.01em; text-transform: none; color: var(--gold-bright); }
  .lv-house .lv-h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,166,96,0.6), transparent); }
  .lv-house .lv-match, .lv-house .lv-plm { border: 1px solid transparent; border-radius: 12px;
    background: linear-gradient(160deg, #161926, #0f111a) padding-box, linear-gradient(135deg, rgba(155,92,224,0.65), rgba(255,255,255,0.05) 45%, rgba(201,166,96,0.5)) border-box; }
  .lv-house .lv-match.is-cup { background: linear-gradient(160deg, #191a1a, #0f111a) padding-box, linear-gradient(135deg, rgba(201,166,96,0.9), rgba(255,255,255,0.05) 50%, rgba(201,166,96,0.6)) border-box; }
  .lv-house .lv-match.is-you { box-shadow: 0 0 0 1px var(--lime), 0 0 26px -8px var(--lime); }
  .lv-house .lv-nums b, .lv-house .lv-plm-s { font-family: "Bebas Neue", sans-serif; color: #fff; }
  .lv-house .lv-sum:has(.lv-home.lead) .lv-nums b:last-of-type, .lv-house .lv-sum:has(.lv-away.lead) .lv-nums b:first-of-type { opacity: 0.45; }
  .lv-house .lv-odds i { background: linear-gradient(90deg, #6a2fa8, #9b5ce0 60%, rgba(0,255,133,0.6)); }
  .lv-house .lv-jump a { border-color: rgba(155,92,224,0.55); }
  .lv-house .lv-jump a:hover { border-color: var(--lime); }
  .lv-house .lv-plm.is-live { box-shadow: 0 0 0 1px rgba(255,59,59,0.7), 0 0 20px -8px #ff3b3b; }
  .lv-house .lv-day { color: var(--gold); }

  /* =====================================================================
     2 · BLACK TIE -- the site's gold taken to the front: near-black,
     gold-foil numbers, serif italics, and every match cut like a
     premium ticket (notched sides, perforated stub line). Purple only as
     a faint glow.
     ===================================================================== */
  .lv.lv-blacktie { --surface: #0e0d0b; --border: rgba(212,176,98,0.22); --edge-bright: rgba(212,176,98,0.45); --text-muted: #a89f8a; --lime: #e8c766; --lime-contrast: #120e05; --gold: #d4b062; --gold-bright: #f6e3a1;
    padding: 26px 22px 32px; border-radius: 4px;
    background: radial-gradient(ellipse 800px 300px at 50% 0, rgba(212,176,98,0.12), transparent 60%), radial-gradient(ellipse 500px 300px at 100% 100%, rgba(106,47,168,0.14), transparent 60%), #070605;
    border: 1px solid rgba(212,176,98,0.45); outline: 1px solid rgba(212,176,98,0.18); outline-offset: 6px; }
  .lv-blacktie .lv-title h2 { font-family: "Cormorant Garamond", serif; font-weight: 700; font-style: italic; letter-spacing: 0; text-transform: none; color: #f3ead2; }
  .lv-blacktie .lv-title h2 em { font-style: italic; background: linear-gradient(180deg, #fff1c2, #d4b062 55%, #9a7629); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lv-blacktie .lv-h3 { display: flex; align-items: center; gap: 14px; justify-content: center; font: 700 0.78rem "Archivo", sans-serif; letter-spacing: 0.38em; color: var(--gold); }
  .lv-blacktie .lv-h3::before, .lv-blacktie .lv-h3::after { content: ""; flex: 1; max-width: 140px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .lv-blacktie .lv-h3::after { transform: scaleX(-1); }
  .lv-blacktie .lv-match, .lv-blacktie .lv-plm { position: relative; border: 1px solid rgba(212,176,98,0.4); border-radius: 6px; background: linear-gradient(180deg, #14120e, #0b0a08);
    -webkit-mask: radial-gradient(circle 9px at 0 46px, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 46px, transparent 98%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 9px at 0 46px, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 46px, transparent 98%, #000) right / 51% 100% no-repeat; }
  .lv-blacktie .lv-plm { -webkit-mask: none; mask: none; }
  .lv-blacktie .lv-match.is-cup { border-color: rgba(246,227,161,0.75); background: linear-gradient(180deg, #1a160d, #0b0a08); }
  .lv-blacktie .lv-match.is-you { border-color: var(--gold-bright); box-shadow: 0 0 26px -10px var(--gold); }
  .lv-blacktie .lv-detail { border-top: 1px dashed rgba(212,176,98,0.45); }
  .lv-blacktie .lv-nums b, .lv-blacktie .lv-plm-s { font-family: "Bebas Neue", sans-serif; background: linear-gradient(180deg, #fff1c2, #d4b062 55%, #9a7629); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lv-blacktie .lv .club-name, .lv-blacktie .club-name { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 1.05em; }
  .lv-blacktie .lv-odds { background: rgba(212,176,98,0.12); }
  .lv-blacktie .lv-odds i { background: linear-gradient(90deg, #9a7629, #e8c766); }
  .lv-blacktie .lv-pl { background: rgba(212,176,98,0.05); }
  .lv-blacktie .lv-mode button[aria-pressed="true"] { background: linear-gradient(180deg, #f6e3a1, #c9a04a); }
  .lv-blacktie .lv-jump a { border-color: rgba(212,176,98,0.5); color: #f3ead2; }

  /* =====================================================================
     3 · TOP FLIGHT -- the legally distinct "big league" look: royal
     purple (the site's own), electric pink and cyan, lime for live, and
     slanted TV-graphics cuts. Mood only: no real logos, names, lion or
     official typeface.
     ===================================================================== */
  .lv.lv-topflight { --bg: #26002c; --surface: #3a0a44; --text: #ffffff; --text-muted: #d6b8e0; --border: rgba(255,255,255,0.12); --edge-bright: rgba(255,255,255,0.3); --lime: #00ff87; --lime-contrast: #26002c; --gold: #04f5ff; --gold-bright: #ff2a8a; --radius: 4px;
    padding: 0 20px 30px; border-radius: 6px; overflow: hidden;
    background: radial-gradient(ellipse at 100% 0, rgba(255,42,138,0.32), transparent 45%), radial-gradient(ellipse at 0 100%, rgba(4,245,255,0.22), transparent 45%), linear-gradient(160deg, #3d0047, #1c0021); }
  .lv-topflight .lv-head { margin: 0 -20px 16px; padding: 20px 24px 18px; background: linear-gradient(100deg, #ff2a8a, #7a00ff 55%, #04f5ff); clip-path: polygon(0 0, 100% 0, 100% 78%, 96% 100%, 0 100%); }
  .lv-topflight .lv-title h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.01em; }
  .lv-topflight .lv-title h2 em { color: #00ff87; }
  .lv-topflight .lv-status { color: rgba(255,255,255,0.88); }
  .lv-topflight .lv-h3 { display: inline-block; padding: 6px 24px 6px 12px; color: #26002c; background: #00ff87; clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); letter-spacing: 0.18em; }
  .lv-topflight .lv-match, .lv-topflight .lv-plm { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02)); border: 0; border-left: 4px solid #04f5ff; border-radius: 4px; }
  .lv-topflight .lv-match.is-cup { border-left-color: #ff2a8a; }
  .lv-topflight .lv-match.is-you { box-shadow: 0 0 0 1px #00ff87, 0 0 24px -8px #00ff87; }
  .lv-topflight .lv-nums b, .lv-topflight .lv-plm-s { font-family: "Barlow Condensed", sans-serif; font-weight: 800; color: #fff; text-shadow: 0 0 18px rgba(4,245,255,0.55); }
  .lv-topflight .lv-odds i { background: linear-gradient(90deg, #ff2a8a, #7a00ff); }
  .lv-topflight .lv-jump a { border-radius: 0; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); background: rgba(255,255,255,0.1); border: 0; }
  .lv-topflight .lv-mode { border-radius: 4px; }
  .lv-topflight .lv-mode button { border-radius: 2px; }

  @media (max-width: 560px) {
    .lv.lv-house, .lv.lv-blacktie { padding: 18px 12px 28px; }
    .lv.lv-topflight { padding: 0 12px 26px; }
    .lv-topflight .lv-head { margin: 0 -12px 14px; padding: 16px 14px; }
    .lv-blacktie .lv-match { -webkit-mask: none; mask: none; }
  }
</style>
</head>
<body>
  <div class="picker">
    <h1>Live page · theme options</h1>
    <div class="picker-row" id="picker"></div>
    <p id="about"></p>
  </div>
  <div class="stage"><div id="app"></div></div>

<script type="module">
  import { loadAllData, managerLookup } from "./js/data.js";
  import { render } from "./js/render/live.js";

  const THEMES = [
    ["lv-house", "House", "<b>The site's own look, dressed for matchday.</b> The midnight panel with a soft purple and gold glow, gold italic section titles, glass match cards with a purple-to-gold edge, and lime for anything live. Sits most naturally next to every other page."],
    ["lv-blacktie", "Black Tie", "<b>The site's gold taken to the front.</b> Near-black, gold-foil scores, serif italics, and every match cut like a premium ticket with notched sides and a perforated line when you open it. Purple stays as a faint glow. The most 'luxury' of the three."],
    ["lv-topflight", "Top Flight", "<b>The legally distinct 'big league' look.</b> Royal purple (already the site's colour), electric pink and cyan, lime for live, and slanted TV-graphics cuts. It borrows the mood, not the marks: no real logos, names, lion or official typeface."],
    ["lv-sunday", "Sunday League (current)", "<b>Today's whiteboard</b>, for comparison."],
  ];

  const app = document.getElementById("app");
  const picker = document.getElementById("picker");
  const about = document.getElementById("about");
  function choose(cls) {
    app.dataset.lvTheme = cls;                       // used on the page's next redraw
    const lv = app.querySelector(".lv");
    if (lv) lv.className = `lv ${cls}`;              // and applied right away
    picker.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === cls)));
    about.innerHTML = THEMES.find((t) => t[0] === cls)[2];
  }
  picker.innerHTML = THEMES.map(([cls, name]) => `<button type="button" data-theme="${cls}">${name}</button>`).join("");
  picker.addEventListener("click", (e) => { const b = e.target.closest("[data-theme]"); if (b) choose(b.dataset.theme); });
  choose("lv-house");

  // The real Live page, on the real data and live relay.
  location.hash = "live";
  const data = await loadAllData();
  render(app, data, managerLookup(data));
</script>
</body>
</html>

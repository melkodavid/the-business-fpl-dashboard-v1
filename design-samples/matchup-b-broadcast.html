<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B — Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* CONCEPT B -- "Broadcast". The look of a live sports telecast: a news
     ticker, scorebug strips, team-colour bars, big condensed numerals and a
     tale-of-the-tape comparison. Graphite + signal red, with each club's own
     colour doing the personality work. */
  :root { --bg: #07090d; --panel: #10141b; --panel2: #161b24; --line: #232b38; --red: #ff2a2a; --gold: #ffc400; --text: #f2f4f8; --muted: #8b95a5; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font-family: "Inter", sans-serif; min-height: 100vh;
    background: radial-gradient(1200px 500px at 50% -120px, #1b2230, transparent 70%), var(--bg); }
  .osw { font-family: "Oswald", sans-serif; text-transform: uppercase; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 18px 80px; }

  /* ticker */
  .ticker { display: flex; align-items: stretch; background: #000; border-bottom: 2px solid var(--red); overflow: hidden; }
  .ticker .lab { flex-shrink: 0; background: var(--red); padding: 9px 16px; font: 700 14px "Oswald"; letter-spacing: 0.14em; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); padding-right: 26px; z-index: 2; }
  .ticker .scroll { overflow: hidden; flex: 1; display: flex; align-items: center; }
  .ticker .track { display: inline-flex; white-space: nowrap; animation: scroll 55s linear infinite; }
  .ticker .track span { font-size: 14px; padding: 0 28px; color: #dfe4ee; } .ticker .track span::before { content: "●"; color: var(--red); margin-right: 14px; font-size: 9px; vertical-align: middle; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* masthead */
  .mast { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 18px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo i { display: grid; place-items: center; width: 44px; height: 44px; background: var(--red); font: 700 26px "Oswald"; font-style: normal; clip-path: polygon(0 0, 100% 0, 100% 78%, 78% 100%, 0 100%); }
  .logo b { display: block; font: 700 24px/1 "Oswald"; letter-spacing: 0.06em; text-transform: uppercase; }
  .logo small { color: var(--muted); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; }
  .gw { text-align: right; }
  .gw h1 { margin: 0; font: 700 44px/1 "Oswald"; text-transform: uppercase; letter-spacing: 0.04em; }
  .gw h1 em { font-style: normal; color: var(--gold); }
  .gw p { margin: 4px 0 0; color: var(--muted); font-size: 13px; } .gw p b { color: var(--text); font-variant-numeric: tabular-nums; }
  .onair { display: inline-flex; align-items: center; gap: 7px; font: 600 12px "Oswald"; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); }
  .onair::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 0 var(--red); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px transparent; } }

  .crest { position: relative; display: inline-grid; place-items: center; width: var(--s, 54px); height: var(--s, 54px); flex-shrink: 0;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 80%, #fff 14%), color-mix(in srgb, var(--c) 70%, #000)); border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
  .crest b { font: 700 calc(var(--s, 54px) * 0.34)/1 "Oswald"; letter-spacing: 0.04em; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .crest img { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: contain; border-radius: 10%; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.6)); }
  .crest:has(img) { background: none; box-shadow: none; } .crest:has(img) b { display: none; }
  .crest.xl { --s: 150px; } .crest.md { --s: 62px; }
  .f { display: inline-grid; place-items: center; width: 19px; height: 19px; margin-right: 3px; font: 600 11px "Oswald"; font-style: normal; border-radius: 2px; color: #fff; }
  .f-W { background: #19a35a; } .f-L { background: #d62f3a; } .f-D { background: #6a7384; }

  /* game of the week */
  .gotw { position: relative; overflow: hidden; border: 1px solid var(--line); margin-bottom: 22px; padding: 22px 24px 24px;
    background: linear-gradient(100deg, color-mix(in srgb, var(--hc) 38%, #0b0e14), #0b0e14 46%, #0b0e14 54%, color-mix(in srgb, var(--ac) 38%, #0b0e14)); }
  .gotw::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 14px); pointer-events: none; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: var(--gold); color: #111; font: 700 13px "Oswald"; letter-spacing: 0.16em; text-transform: uppercase; padding: 5px 14px; position: relative; }
  .gotw-grid { position: relative; display: grid; grid-template-columns: 1fr 250px 1fr; align-items: center; gap: 12px; margin-top: 12px; }
  .gs { display: flex; align-items: center; gap: 18px; } .gs.r { flex-direction: row-reverse; text-align: right; }
  .gs .abbr { font: 700 clamp(60px, 9vw, 112px)/0.9 "Oswald"; letter-spacing: 0.02em; }
  .gs .nm { color: #cfd6e4; font-size: 14px; margin-top: 4px; } .gs .mg { color: var(--muted); font-size: 12px; }
  .vs { text-align: center; }
  .vs .v { font: 700 22px "Oswald"; letter-spacing: 0.3em; color: var(--muted); }
  .vs .pcts { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; font: 700 40px/1 "Oswald"; }
  .vs .pcts .d { font-size: 18px; color: var(--muted); }
  .gauge { position: relative; display: flex; height: 12px; margin-top: 8px; background: #000; border: 1px solid var(--line); }
  .gauge i { display: block; height: 100%; } .gauge .m { position: absolute; left: 50%; top: -5px; bottom: -5px; width: 2px; background: #fff; opacity: .6; }
  .vs small { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

  /* tale of the tape */
  .tape { position: relative; margin-top: 22px; display: grid; gap: 7px; }
  .tape .t { display: grid; grid-template-columns: 1fr 108px 1fr; align-items: center; gap: 10px; }
  .tape .lab { text-align: center; font: 600 11px "Oswald"; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .tape .bar { position: relative; height: 22px; background: rgba(255,255,255,0.05); display: flex; align-items: center; }
  .tape .bar.l { justify-content: flex-end; } .tape .bar span { display: block; height: 100%; }
  .tape .bar b { position: absolute; top: 50%; transform: translateY(-50%); font: 700 14px "Oswald"; letter-spacing: 0.04em; }
  .tape .bar.l b { left: 8px; } .tape .bar.r b { right: 8px; }
  .tape .win { box-shadow: 0 0 14px -2px currentColor; }

  /* scorebug fixture strips */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .bug { background: var(--panel); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s, transform .15s; }
  .bug:hover { border-color: #3a4558; transform: translateY(-2px); }
  .bug .top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px 0 14px; }
  .tag { background: var(--red); font: 600 11px "Oswald"; letter-spacing: 0.16em; text-transform: uppercase; padding: 2px 9px; }
  .tag.quiet { background: #2a3140; color: #b9c2d3; }
  .rankline { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
  .strip { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; margin: 10px 0 0; }
  .side { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0; }
  .side.r { flex-direction: row-reverse; text-align: right; }
  .side::before { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; background: var(--c); } .side::before { left: 0; } .side.r::before { left: auto; right: 0; }
  .side .ab { font: 700 34px/1 "Oswald"; letter-spacing: 0.03em; } .side .cl { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .pct { align-self: center; font: 700 30px/1 "Oswald"; min-width: 64px; text-align: center; } .pct small { display: block; font: 500 10px "Inter"; letter-spacing: .1em; color: var(--muted); }
  .mid { display: grid; place-items: center; padding: 0 6px; min-width: 70px; } .mid b { font: 700 18px "Oswald"; letter-spacing: 0.2em; color: var(--muted); }
  .lower { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: var(--panel2); border-top: 1px solid var(--line); font-size: 12px; color: #c4ccda; }
  .lower .xi { font-variant-numeric: tabular-nums; } .lower .xi b { color: var(--gold); font-weight: 600; }
  .drawer { display: none; padding: 14px 14px 16px; border-top: 1px solid var(--line); background: #0c1016; } .bug.open .drawer { display: block; }
  .drawer .tape { margin-top: 0; }
  .note { margin: 26px 0 0; text-align: center; color: var(--muted); font-size: 12px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .gotw-grid { grid-template-columns: 1fr; } .gs.r { flex-direction: row; text-align: left; } .gw { text-align: left; } }
</style>
</head>
<body>
<div class="ticker"><div class="lab">Latest</div><div class="scroll"><div class="track" id="track"></div></div></div>
<div class="wrap">
  <header class="mast">
    <div class="logo"><i>B</i><div><b>The Business</b><small>Fantasy League</small></div></div>
    <div class="gw">
      <h1>Gameweek <em id="gwnum">6</em></h1>
      <p id="lockline"></p>
    </div>
  </header>
  <section id="gotw"></section>
  <section class="grid" id="grid"></section>
  <p class="note" id="note"></p>
</div>

<script type="module">
import { loadMatchups, crestHtml, countdown, formDots, sign } from "./common.js";
const data = await loadMatchups();
document.getElementById("gwnum").textContent = data.gw;

const headlines = data.headlines.length ? data.headlines : ["Season 26/27 is underway"];
document.getElementById("track").innerHTML = [...headlines, ...headlines].map((h) => `<span>${h}</span>`).join("");

const deadline = data.deadline ? new Date(data.deadline) : null;
function tick() {
  const c = countdown(data.deadline);
  const when = deadline ? deadline.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
  document.getElementById("lockline").innerHTML = c.over
    ? `<span class="onair">Lineups locked</span>`
    : `Lineups lock <b>${when}</b> &nbsp;·&nbsp; <b>${c.d}d ${String(c.h).padStart(2, "0")}h ${String(c.m).padStart(2, "0")}m ${String(c.s).padStart(2, "0")}s</b>`;
}
tick(); setInterval(tick, 1000);

// diverging comparison bars: each metric shows who has the edge
function tape(f) {
  const rows = [
    ["Table", f.home.rank, f.away.rank, false, (v) => `#${v}`],
    ["Points", f.home.points, f.away.points, true, (v) => v],
    ["Points for", f.home.pf, f.away.pf, true, (v) => v],
    ["Form avg", f.home.formAvg, f.away.formAvg, true, (v) => v],
    ["Luck", f.home.luck, f.away.luck, null, (v) => sign(v)],
    ["Projected XI", f.home.expected, f.away.expected, true, (v) => v],
  ];
  return rows.map(([lab, a, b, hi, fmt]) => {
    const shift = Math.min(a, b) < 0 ? -Math.min(a, b) + 1 : 0;
    const pa = a + shift, pb = b + shift;
    const share = (pa + pb) ? pa / (pa + pb) : 0.5;
    const edgeHome = hi === null ? false : hi ? a > b : a < b, edgeAway = hi === null ? false : hi ? b > a : b < a;
    const wa = (lab === "Table" ? 1 - share : share) * 100;
    const wb = 100 - wa;
    return `<div class="t">
      <div class="bar l"><span class="${edgeHome ? "win" : ""}" style="width:${wa}%;background:${edgeHome ? f.home.color : "#3a4352"};color:${f.home.color}"></span><b>${fmt(a)}</b></div>
      <div class="lab">${lab}</div>
      <div class="bar r"><span class="${edgeAway ? "win" : ""}" style="width:${wb}%;background:${edgeAway ? f.away.color : "#3a4352"};color:${f.away.color}"></span><b>${fmt(b)}</b></div>
    </div>`;
  }).join("");
}

const gauge = (f) => `<div class="gauge"><i style="width:${f.home.winPct}%;background:${f.home.color}"></i><i style="width:${f.drawPct}%;background:#6a7384"></i><i style="width:${f.away.winPct}%;background:${f.away.color}"></i><span class="m"></span></div>`;
const live = data.oddsMeta?.basis === "live";

const [top, ...rest] = [...data.fixtures].sort((a, b) => b.importance - a.importance);
document.getElementById("gotw").innerHTML = top ? `
  <div class="gotw" style="--hc:${top.home.color};--ac:${top.away.color}">
    <span class="badge">★ Game of the week${top.tag ? ` · ${top.tag}` : ""}</span>
    <div class="gotw-grid">
      <div class="gs">${crestHtml(top.home, "xl")}<div><div class="abbr osw">${top.home.abbr}</div><div class="nm">${top.home.club}</div><div class="mg">${top.home.manager} · ${top.home.record}</div><div style="margin-top:8px">${formDots(top.home.form)}</div></div></div>
      <div class="vs">
        <div class="v">VS</div>
        <div class="pcts"><span style="color:${top.home.color}">${top.home.winPct}%</span><span class="d">${top.drawPct}%</span><span style="color:${top.away.color}">${top.away.winPct}%</span></div>
        ${gauge(top)}
        <small>${live ? "Live" : "Win"} probability · XI ${top.home.expected}–${top.away.expected}</small>
      </div>
      <div class="gs r">${crestHtml(top.away, "xl")}<div><div class="abbr osw">${top.away.abbr}</div><div class="nm">${top.away.club}</div><div class="mg">${top.away.manager} · ${top.away.record}</div><div style="margin-top:8px">${formDots(top.away.form)}</div></div></div>
    </div>
    <div class="tape">${tape(top)}</div>
  </div>` : "";

document.getElementById("grid").innerHTML = rest.map((f) => `
  <article class="bug">
    <div class="top"><span class="tag ${f.tag ? "" : "quiet"}">${f.tag || "Fixture"}</span><span class="rankline">#${f.home.rank} v #${f.away.rank}</span></div>
    <div class="strip">
      <div class="side" style="--c:${f.home.color}">${crestHtml(f.home, "md")}<div><div class="ab osw">${f.home.abbr}</div><div class="cl">${f.home.club}</div></div></div>
      <div style="display:flex">
        <div class="pct" style="color:${f.home.color}">${f.home.winPct}<small>%</small></div>
        <div class="mid"><b>VS</b></div>
        <div class="pct" style="color:${f.away.color}">${f.away.winPct}<small>%</small></div>
      </div>
      <div class="side r" style="--c:${f.away.color}">${crestHtml(f.away, "md")}<div><div class="ab osw">${f.away.abbr}</div><div class="cl">${f.away.club}</div></div></div>
    </div>
    <div style="padding:10px 14px 0">${gauge(f)}</div>
    <div class="lower"><span>${formDots(f.home.form)}</span><span class="xi">Projected XI <b>${f.home.expected}</b> – <b>${f.away.expected}</b></span><span>${formDots(f.away.form)}</span></div>
    <div class="drawer"><div class="tape">${tape(f)}</div></div>
  </article>`).join("");
document.querySelectorAll(".bug").forEach((el) => el.addEventListener("click", () => el.classList.toggle("open")));

document.getElementById("note").textContent = data.oddsMeta
  ? `Probabilities use ${data.oddsMeta.source} for each manager's best XI — a for-fun estimate. Tap a fixture for the full comparison.`
  : "Tap a fixture for the full comparison.";
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home B — Starting XI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style id="local">
  /* HOME B -- "Starting XI". The league lines up on a pitch (the most
     decorated up front, the newest at the back) and the pass map becomes a live
     build-up play: the ball works from the keeper through defence and midfield
     to a striker, lighting the lines it travels. Hover a player to see their
     passing lanes; click to play as them. */
  .head { text-align: center; padding: 46px 0 22px; }
  .eyebrow { margin: 0 0 8px; font: 700 12px "Archivo"; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); animation: fadeUp .9s .1s both; }
  .title { margin: 0; font: italic 500 clamp(54px, 9vw, 92px)/1 "Cormorant Garamond"; background: linear-gradient(100deg, #8a7a5a 20%, #fff7df 45%, #ecd9a3 52%, #8a7a5a 80%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: titleIn 1.3s .2s cubic-bezier(.2,.9,.2,1) both, shimmer 7s 1.6s ease-in-out infinite; }
  @keyframes titleIn { from { opacity: 0; filter: blur(12px); transform: translateY(24px); } to { opacity: 1; filter: none; transform: none; } }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  .sub { margin: 10px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 0.04em; animation: fadeUp .9s .7s both; }
  .sub b { color: var(--gold-b); }

  .pitch-wrap { position: relative; margin: 8px 0 26px; animation: fadeUp 1s .5s both; }
  .pitch { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 1px solid rgba(201,166,96,0.45);
    background:
      repeating-linear-gradient(90deg, rgba(0,255,133,0.045) 0 7.14%, transparent 7.14% 14.28%),
      radial-gradient(ellipse at 50% 50%, rgba(0,255,133,0.08), transparent 70%),
      linear-gradient(180deg, #0c1612, #09100d);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.9), 0 0 80px -30px rgba(0,255,133,0.25), inset 0 0 80px rgba(0,0,0,0.5); }
  .pitch::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(255,240,190,0.07) 50%, transparent 60%); transform: translateX(-120%); animation: sheen 9s 2s ease-in-out infinite; }
  @keyframes sheen { 35%, 100% { transform: translateX(120%); } }
  .pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pitch canvas { position: absolute; inset: 0; }
  .pl { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); z-index: 2; width: 112px; display: grid; justify-items: center; gap: 4px; cursor: pointer; background: none; border: 0; color: inherit; font: inherit; padding: 0;
    opacity: 0; animation: drop .8s calc(var(--i) * 90ms + .9s) cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -140%) scale(0.5); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .pl .ava { position: relative; transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
  .pl .av { --s: 66px; box-shadow: 0 0 0 3px #0a0f0c, 0 0 0 5px var(--rc, #666), 0 10px 22px rgba(0,0,0,0.6); }
  .pl:hover .ava, .pl:focus-visible .ava { transform: scale(1.18) translateY(-4px); }
  .pl .nm { padding: 2px 10px; border-radius: 3px; background: rgba(8,10,16,0.82); border: 1px solid var(--line); font: 700 12px "Archivo"; white-space: nowrap; }
  .pl .rr { font: 700 9px "Archivo"; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rc); text-shadow: 0 1px 3px #000; }
  .pl .cap { position: absolute; right: -6px; top: -4px; z-index: 3; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #fff3b8, #d9a53c); color: #1b1405; font: 900 12px "Archivo"; box-shadow: 0 0 12px rgba(255,201,63,0.7); animation: blip 2.4s infinite; }
  .pl .stars { position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%); font-size: 9px; color: var(--gold-b); letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  .pl.r-mythic .av { animation: pulsem 3s ease-in-out infinite; } .pl.r-legendary .av { animation: pulsel 3s ease-in-out infinite; }
  @keyframes pulsem { 50% { box-shadow: 0 0 0 3px #0a0f0c, 0 0 0 5px var(--rc), 0 0 34px 6px #ff6ad0, 0 10px 22px rgba(0,0,0,0.6); } }
  @keyframes pulsel { 50% { box-shadow: 0 0 0 3px #0a0f0c, 0 0 0 5px var(--rc), 0 0 28px 4px #ffc93f, 0 10px 22px rgba(0,0,0,0.6); } }
  .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 8px); width: 210px; padding: 12px 14px; border-radius: 6px; text-align: left; pointer-events: none; opacity: 0; transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.2,1);
    background: linear-gradient(160deg, #1a1d2b, #10121b); border: 1px solid var(--rc, var(--gold)); box-shadow: 0 16px 30px -10px rgba(0,0,0,0.9); z-index: 10; }
  .pl:hover .tip, .pl:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  .pl:hover, .pl:focus-visible { z-index: 20; }
  .tip b { display: block; font: 800 14px "Archivo"; } .tip small { display: block; color: var(--muted); font-size: 11px; margin: 2px 0 6px; }
  .tip .rec { font: 400 20px "Bebas Neue"; letter-spacing: 0.04em; } .tip .go { margin-top: 6px; font: 800 10px "Archivo"; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-b); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin: 0 0 30px; font: 700 10px "Archivo"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); animation: fadeUp 1s 1.8s both; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rc); margin-right: 7px; box-shadow: 0 0 8px var(--rc); vertical-align: -1px; }
  @media (max-width: 820px) {
    .pitch { aspect-ratio: 3 / 4.5; } .pl { width: 82px; } .pl .av { --s: 48px; } .pl .nm { font-size: 10px; padding: 1px 6px; } .pl .rr { display: none; } .tip { width: 170px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <p class="eyebrow">Who's watching?</p>
    <h1 class="title">The Business</h1>
    <p class="sub">Pick your player. <b>Most decorated up front</b>, newest in goal — hover for the passing lanes.</p>
  </header>
  <div class="pitch-wrap"><div class="pitch" id="pitch"></div></div>
  <div class="legend" id="legend"></div>
</div>
<div id="banner"></div>

<script type="module">
import { loadHome, avatarHtml, newsBannerHtml, selectManager, sharedCss } from "./home-shared.js";
document.head.insertAdjacentHTML("beforeend", `<style>${sharedCss}</style>`);
const { people, news } = await loadHome();
document.getElementById("banner").innerHTML = newsBannerHtml(news);

const pitch = document.getElementById("pitch");
const mq = matchMedia("(max-width: 820px)");

// 1-4-4-3: three most decorated up front (best in the middle), then midfield, defence, and the newest in goal.
function layout() {
  const portrait = mq.matches;
  const pos = (line, k, n) => {
    const span = (i, count, lo, hi) => (count === 1 ? (lo + hi) / 2 : lo + ((hi - lo) * i) / (count - 1));
    if (!portrait) {
      const x = { gk: 7, def: 27, mid: 52, fwd: 80 }[line];
      const y = line === "gk" ? 50 : line === "fwd" ? span(k, n, 24, 76) : span(k, n, 14, 86);
      return [x, y];
    }
    const y = { gk: 91, def: 72, mid: 49, fwd: 22 }[line];
    const x = line === "gk" ? 50 : line === "fwd" ? span(k, n, 22, 78) : span(k, n, 13, 87);
    return [x, y];
  };
  const fwd = [people[1], people[0], people[2]];              // champion in the middle of the front three
  const mid = people.slice(3, 7), def = people.slice(7, 11), gk = [people[11]];
  const slots = [];
  [["fwd", fwd], ["mid", mid], ["def", def], ["gk", gk]].forEach(([line, list]) =>
    list.forEach((p, k) => { if (p) slots.push({ p, line, k, n: list.length, xy: pos(line, k, list.length) }); }));
  return slots;
}

const markings = (portrait) => portrait
  ? `<svg class="lines" viewBox="0 0 90 135" preserveAspectRatio="none" fill="none" stroke="rgba(236,217,163,0.35)" stroke-width="0.5" vector-effect="non-scaling-stroke"><rect x="4" y="4" width="82" height="127"/><line x1="4" y1="67.5" x2="86" y2="67.5"/><circle cx="45" cy="67.5" r="11"/><rect x="22" y="4" width="46" height="18"/><rect x="33" y="4" width="24" height="7"/><rect x="22" y="113" width="46" height="18"/><rect x="33" y="124" width="24" height="7"/></svg>`
  : `<svg class="lines" viewBox="0 0 160 90" preserveAspectRatio="none" fill="none" stroke="rgba(236,217,163,0.35)" stroke-width="0.4"><rect x="4" y="4" width="152" height="82"/><line x1="80" y1="4" x2="80" y2="86"/><circle cx="80" cy="45" r="11"/><rect x="4" y="22" width="20" height="46"/><rect x="4" y="33" width="8" height="24"/><rect x="136" y="22" width="20" height="46"/><rect x="148" y="33" width="8" height="24"/></svg>`;

let slots = [], edges = [], raf = 0;
function build() {
  slots = layout();
  pitch.innerHTML = `${markings(mq.matches)}<canvas></canvas>` + slots.map(({ p, xy }, i) => `
    <button class="pl r-${p.rarity.id}" style="--x:${xy[0]}%;--y:${xy[1]}%;--i:${i}" data-key="${p.key}" data-i="${i}">
      <span class="ava">${avatarHtml(p)}${p.isReigning ? `<span class="cap" title="Reigning champion">C</span>` : ""}${p.titles ? `<span class="stars">${"★".repeat(Math.min(p.titles, 5))}</span>` : ""}</span>
      <span class="nm">${p.name.split(" ")[0]}</span><span class="rr">${p.rarity.label}</span>
      <span class="tip"><b>${p.name}</b><small>${p.club} · ${p.rarity.label} · ${p.seasons} season${p.seasons === 1 ? "" : "s"}</small><span class="rec">${p.w}-${p.d}-${p.l} · ${Math.round(p.winPct)}%</span><div class="go">Play as ${p.name.split(" ")[0]} →</div></span>
    </button>`).join("");

  // passing lanes: keeper to defence, then each line to the next, plus lateral links
  const by = (line) => slots.map((s, i) => ({ ...s, i })).filter((s) => s.line === line);
  const L = { gk: by("gk"), def: by("def"), mid: by("mid"), fwd: by("fwd") };
  edges = [];
  const link = (a, b) => edges.push([a.i, b.i]);
  L.def.forEach((d) => link(L.gk[0], d));
  [L.def, L.mid, L.fwd].forEach((line) => line.slice(1).forEach((s, k) => link(line[k], s)));
  const near = (from, to) => from.forEach((a) => to.slice().sort((x, y) => Math.hypot(x.xy[0] - a.xy[0], x.xy[1] - a.xy[1]) - Math.hypot(y.xy[0] - a.xy[0], y.xy[1] - a.xy[1])).slice(0, 2).forEach((b) => link(a, b)));
  near(L.def, L.mid); near(L.mid, L.fwd);
  startPlay(L);
}

function startPlay(L) {
  cancelAnimationFrame(raf);
  const canvas = pitch.querySelector("canvas"), ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let W, H;
  const size = () => { W = pitch.clientWidth; H = pitch.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size();
  const pt = (i) => [(slots[i].xy[0] / 100) * W, (slots[i].xy[1] / 100) * H];
  const adj = new Map(); edges.forEach(([a, b]) => { (adj.get(a) ?? adj.set(a, []).get(a)).push(b); (adj.get(b) ?? adj.set(b, []).get(b)).push(a); });
  let hover = null;
  pitch.onpointerover = (e) => { const b = e.target.closest(".pl"); hover = b ? Number(b.dataset.i) : null; };
  pitch.onpointerleave = () => { hover = null; };

  // one build-up: keeper -> defender -> midfielder -> striker, then a flash
  const chain = () => {
    const gk = L.gk[0].i, pick = (arr) => arr[Math.floor(Math.random() * arr.length)].i;
    const d = pick(L.def), m = pick(L.mid), f = pick(L.fwd);
    return [gk, d, m, f];
  };
  let play = null, rest = 0, last = null, burst = null;
  const lit = new Map(); // edge key -> brightness
  function frame(now) {
    if (!canvas.isConnected) return;
    if (last == null) last = now;
    const dt = Math.min(50, now - last); last = now;
    if (pitch.clientWidth !== W) size();
    ctx.clearRect(0, 0, W, H);

    edges.forEach(([a, b]) => {
      const key = a < b ? `${a}-${b}` : `${b}-${a}`;
      const glow = lit.get(key) ?? 0;
      const hot = hover !== null && (a === hover || b === hover) ? 1 : 0;
      const [ax, ay] = pt(a), [bx, by] = pt(b);
      ctx.strokeStyle = `rgba(236,217,163,${(0.12 + glow * 0.7 + hot * 0.5).toFixed(3)})`;
      ctx.lineWidth = 1 + glow * 1.6 + hot;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      lit.set(key, Math.max(0, glow - dt * 0.0007));
    });

    if (!reduce) {
      if (!play && now > rest) play = { path: chain(), leg: 0, t: 0 };
      if (play) {
        const a = play.path[play.leg], b = play.path[play.leg + 1];
        play.t += dt / 560;
        const [ax, ay] = pt(a), [bx, by] = pt(b);
        const x = ax + (bx - ax) * Math.min(1, play.t), y = ay + (by - ay) * Math.min(1, play.t);
        lit.set(a < b ? `${a}-${b}` : `${b}-${a}`, 1);
        const g = ctx.createRadialGradient(x, y, 0, x, y, 16);
        g.addColorStop(0, "rgba(255,248,214,1)"); g.addColorStop(0.4, "rgba(236,217,163,0.55)"); g.addColorStop(1, "rgba(236,217,163,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
        if (play.t >= 1) {
          play.leg++; play.t = 0;
          if (play.leg >= play.path.length - 1) { burst = { at: pt(b), t: 0 }; play = null; rest = now + 2200; }
        }
      }
      if (burst) {
        burst.t += dt / 900;
        const r = 20 + burst.t * 70;
        ctx.strokeStyle = `rgba(0,255,133,${(1 - burst.t).toFixed(3)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(burst.at[0], burst.at[1], r, 0, Math.PI * 2); ctx.stroke();
        if (burst.t >= 1) burst = null;
      }
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

build();
mq.addEventListener("change", build);
pitch.addEventListener("click", (e) => { const b = e.target.closest(".pl"); if (b) selectManager(b.dataset.key); });
document.getElementById("legend").innerHTML = ["mythic", "legendary", "epic", "rare", "uncommon", "common"].map((r) => `<span class="r-${r}">${r}</span>`).join("");
</script>
</body>
</html>
